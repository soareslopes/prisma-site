<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prisma — Spatial Intelligence, Territorial Analytics and Evidence-Based Consulting. Empowering Places With Science." />
    <title>Prisma — Empowering Places With Science</title>
    <!-- Leaflet CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <!-- SPA GitHub Pages redirect restore -->
    <script>
      (function(l) {
        if (l.search[1] === 'p' || l.search.indexOf('?p=') === 0) {
          var decoded = l.search.slice(1).split('&').reduce(function(q, s) {
            var kv = s.split('=');
            if (kv[0] === 'p') q.path = '/' + kv[1].replace(/~and~/g, '&');
            if (kv[0] === 'q') q.search = '?' + kv[1].replace(/~and~/g, '&');
            return q;
          }, { path: '', search: '' });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded.path + decoded.search + l.hash
          );
        }
      }(window.location));
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
