<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Prisma — Empowering Places With Science</title>
  <script>
    // SPA redirect trick for GitHub Pages
    // Encodes the path as a query param and redirects to index.html
    var segmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
